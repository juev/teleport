name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Debug and release builds, unit and Robolectric tests, lint. The release is built unsigned: it is
  # there to catch what R8 breaks.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleRelease
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
